# Server
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/vns_healthcare?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Storage
#app.storage.type=${APP_STORAGE_TYPE:local}
#app.upload-dir=${APP_UPLOAD_DIR:uploads}
#aws.region=${AWS_REGION:us-east-1}
#aws.s3.bucket=${AWS_S3_BUCKET:}
#aws.s3.endpoint=${AWS_S3_ENDPOINT:}
#aws.access-key=${AWS_ACCESS_KEY_ID:}
#aws.secret-key=${AWS_SECRET_ACCESS_KEY:}

# MinIO example (uncomment to use local MinIO)
app.storage.type=database
aws.s3.bucket=
aws.region=us-east-1
aws.s3.endpoint=
aws.access-key=minioadmin
aws.secret-key=minioadmin

# Thymeleaf
spring.thymeleaf.cache=true

# Connection pool (HikariCP) tuning
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${HIKARI_CONN_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}

#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Server (Tomcat) thread tuning
server.tomcat.max-threads=${TOMCAT_MAX_THREADS:20}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:madhukars812@gmail.com}
spring.mail.password=${MAIL_PASSWORD:replace-with-real-password}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

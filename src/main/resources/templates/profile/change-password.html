<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout('Change password', ~{::section})">
<section>
    <div class="topbar">
        <div>
            <p class="eyebrow">Account</p>
            <h2 class="page-title">Change password</h2>
        </div>
    </div>

    <div class="panel form-panel" style="max-width:560px;">
        <div th:if="${formError}" class="form-banner error">
            <strong>Review required.</strong>
            <span th:text="${formError}"></span>
        </div>
        <div th:if="${success}" class="form-banner success">
            <strong>Password updated.</strong>
            <span th:text="${success}"></span>
        </div>

        <form th:action="@{/profile/password}" method="post" class="form-grid password-form" style="margin:0;">
            <div class="field full">
                <label for="currentPassword">Current password</label>
                <div class="password-field-group">
                    <input id="currentPassword"
                           type="password"
                           name="currentPassword"
                           required="required"
                           th:classappend="${currentPasswordError != null} ? 'is-invalid' : ''"
                           autocomplete="current-password" />
                    <button type="button" class="password-toggle" data-target="currentPassword" aria-label="Show or hide current password">
                        <span aria-hidden="true">👁</span>
                    </button>
                </div>
                <div class="field-error" th:if="${currentPasswordError}" th:text="${currentPasswordError}"></div>
            </div>

            <div class="field full">
                <label for="newPassword">New password</label>
                <div class="password-field-group">
                    <input id="newPassword"
                           type="password"
                           name="newPassword"
                           required="required"
                           th:classappend="${newPasswordError != null} ? 'is-invalid' : ''"
                           autocomplete="new-password" />
                    <button type="button" class="password-toggle" data-target="newPassword" aria-label="Show or hide new password">
                        <span aria-hidden="true">👁</span>
                    </button>
                </div>
                <div class="field-error" th:if="${newPasswordError}" th:text="${newPasswordError}"></div>
            </div>

            <div class="field full">
                <label for="confirmPassword">Confirm new password</label>
                <div class="password-field-group">
                    <input id="confirmPassword"
                           type="password"
                           name="confirmPassword"
                           required="required"
                           th:classappend="${confirmPasswordError != null} ? 'is-invalid' : ''"
                           autocomplete="new-password" />
                    <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Show or hide confirm password">
                        <span aria-hidden="true">👁</span>
                    </button>
                </div>
                <div class="field-error" th:if="${confirmPasswordError}" th:text="${confirmPasswordError}"></div>
            </div>

            <div class="field full form-actions">
                <button class="btn" type="submit">Update password</button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.password-toggle').forEach(function (toggleButton) {
                toggleButton.addEventListener('click', function () {
                    const targetId = toggleButton.getAttribute('data-target');
                    const input = document.getElementById(targetId);
                    if (!input) return;

                    const shouldShow = input.type === 'password';
                    input.type = shouldShow ? 'text' : 'password';
                    toggleButton.innerHTML = shouldShow ? '<span aria-hidden="true">🙈</span>' : '<span aria-hidden="true">👁</span>';
                });
            });
        });
    </script>
</section>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout('User activity', ~{::section})">
<section>
    <div class="topbar">
        <div>
            <p class="eyebrow">Audit</p>
            <h2 class="page-title">User activity</h2>
            <p class="sub">Track login/logout times and record changes across the application.</p>
        </div>
        <div class="row-actions compact">
            <a class="btn ghost" th:href="@{/admin/users}">Back to users</a>
        </div>
    </div>

    <div class="panel">
        <div class="topbar" style="margin-bottom:8px;">
            <div></div>
            <div class="row-actions compact">
                <a class="btn ghost small" th:if="${pagination != null and pagination.hasPrevious()}" th:href="@{/admin/activity(page=${currentPage - 1}, size=${pageSize})}">Previous</a>
                <span class="sub" th:if="${pagination != null}" th:text="${'Page ' + (currentPage + 1) + ' of ' + pagination.totalPages}">Page 1</span>
                <a class="btn ghost small" th:if="${pagination != null and pagination.hasNext()}" th:href="@{/admin/activity(page=${currentPage + 1}, size=${pageSize})}">Next</a>
            </div>
        </div>

        <div th:if="${!#lists.isEmpty(groupedActivities)}" style="display:flex; flex-direction:column; gap:12px;">
            <details th:each="entry : ${groupedActivities}" style="border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff;" open>
                <summary style="cursor:pointer; list-style:none; padding:12px 14px; background:#f8fafc; font-weight:600; border-bottom:1px solid var(--line);">
                    <span th:text="${#temporals.format(entry.key, 'dd MMM yyyy')}">29 Sep 2026</span>
                </summary>
                <table style="width:100%; border-collapse:collapse;">
                    <thead>
                    <tr>
                        <th style="padding:10px 12px; border-bottom:1px solid var(--line); text-align:left; width:170px;">Time</th>
                        <th style="padding:10px 12px; border-bottom:1px solid var(--line); text-align:left; width:120px;">User</th>
                        <th style="padding:10px 12px; border-bottom:1px solid var(--line); text-align:left; width:110px;">Action</th>
                        <th style="padding:10px 12px; border-bottom:1px solid var(--line); text-align:left; width:140px;">Entity</th>
                        <th style="padding:10px 12px; border-bottom:1px solid var(--line); text-align:left;">Details</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="activity : ${entry.value}">
                        <td style="padding:10px 12px; border-bottom:1px solid var(--line);" th:text="${#temporals.format(activity.createdAt, 'dd MMM yyyy HH:mm')}">29 Sep 2026 23:24</td>
                        <td style="padding:10px 12px; border-bottom:1px solid var(--line);" th:text="${activity.username}">Kiran</td>
                        <td style="padding:10px 12px; border-bottom:1px solid var(--line);">
                            <span class="badge ok" th:if="${activity.activityType == 'LOGIN'}">LOGIN</span>
                            <span class="badge coral" th:if="${activity.activityType == 'LOGOUT'}">LOGOUT</span>
                            <span class="badge" th:if="${activity.activityType == 'CREATE'}">CREATE</span>
                            <span class="badge warn" th:if="${activity.activityType == 'UPDATE'}">UPDATE</span>
                            <span class="badge muted" th:if="${activity.activityType == 'DELETE'}">DELETE</span>
                            <span class="badge" th:unless="${activity.activityType == 'LOGIN' or activity.activityType == 'LOGOUT' or activity.activityType == 'CREATE' or activity.activityType == 'UPDATE' or activity.activityType == 'DELETE'}" th:text="${activity.activityType}">ACTION</span>
                        </td>
                        <td style="padding:10px 12px; border-bottom:1px solid var(--line);" th:text="${activity.entityType != null ? activity.entityType : '—'}">CUSTOMER_INVOICE</td>
                        <td style="padding:10px 12px; border-bottom:1px solid var(--line);" th:text="${activity.description != null and !#strings.isEmpty(activity.description) ? activity.description : '—'}">Saved invoice ...</td>
                    </tr>
                    </tbody>
                </table>
            </details>
        </div>
        <p class="empty" th:if="${#lists.isEmpty(groupedActivities)}">No user activity found yet.</p>
    </div>
</section>
</html>

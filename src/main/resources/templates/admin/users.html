<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout('Users', ~{::section})">
<section>
    <div class="topbar">
        <div>
            <p class="eyebrow">Access control</p>
            <h2 class="page-title">System users</h2>
            <p class="sub">Admin can add users and assign roles for login access.</p>
        </div>
        <div class="row-actions compact">
            <a class="btn" th:href="@{/admin/users/new}">Add user</a>
            <a class="btn ghost" th:href="@{/admin/bank-accounts}">Bank accounts</a>
        </div>
    </div>


    <form class="search" method="get" th:action="@{/admin/users}">
        <select name="status" style="max-width:180px">
            <option value="">All status</option>
            <option value="true" th:selected="${status == 'true'}">Active</option>
            <option value="false" th:selected="${status == 'false'}">Disabled</option>
        </select>
        <button class="btn" type="submit">Filter</button>
        <a class="btn ghost" th:href="@{/admin/users}">Clear</a>
    </form>

    <div class="panel">
        <table th:if="${!users.isEmpty()}">
            <thead>
            <tr>
                <th><a th:href="@{/admin/users(status=${status}, sort='username', dir=${sort == 'username' and dir == 'asc' ? 'desc' : 'asc'})}">Username <span th:if="${sort == 'username'}" th:text="${dir == 'asc' ? '↑' : '↓'}">↑</span></a></th>
                <th>Roles</th>
                <th><a th:href="@{/admin/users(status=${status}, sort='enabled', dir=${sort == 'enabled' and dir == 'asc' ? 'desc' : 'asc'})}">Status <span th:if="${sort == 'enabled'}" th:text="${dir == 'asc' ? '↑' : '↓'}">↑</span></a></th>
                <th><a th:href="@{/admin/users(status=${status}, sort='updatedAt', dir=${sort == 'updatedAt' and dir == 'asc' ? 'desc' : 'asc'})}">Last updated <span th:if="${sort == 'updatedAt'}" th:text="${dir == 'asc' ? '↑' : '↓'}">↑</span></a></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.username}">admin</td>
                <td>
                    <span class="badge" th:each="role : ${user.roles}" th:text="${role.name}">ADMIN</span>
                </td>
                <td>
                    <span class="badge ok" th:if="${user.enabled}">Active</span>
                    <span class="badge muted" th:unless="${user.enabled}">Disabled</span>
                </td>
                <td>
                    <div class="row-actions compact">
                        <a class="btn ghost small" th:href="@{/admin/users/{id}/edit(id=${user.id})}">Edit</a>
                        <form th:if="${!#strings.equalsIgnoreCase(user.username, 'admin')}" th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" onsubmit="return confirm('Delete this user?');">
                            <button class="btn coral small" type="submit">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        <p class="empty" th:if="${users.isEmpty()}">No users created yet.</p>
    </div>
</section>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="auth-body">
<div class="auth-shell">
    <div class="auth-panel">
        <div class="auth-copy">
            <div class="auth-brand">
                <div class="mark">V</div>
                <div>
                    <h1>VNS Healthcare</h1>
                    <p>Home care desk</p>
                </div>
            </div>
            <h2>Reset your access securely.</h2>
            <p class="auth-tagline">Enter your username or registered email to receive a one-time password reset code.</p>
        </div>

        <form th:action="@{/forgot-password}" method="post" class="auth-card">
            <input th:if="${_csrf != null}" type="hidden" name="_csrf" th:value="${_csrf.token}"/>
            <div class="card-header">
                <span>Account recovery</span>
                <h3>Forgot password</h3>
            </div>

            <div th:if="${successMessage}" class="flash success auth-flash" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="flash error auth-flash" th:text="${errorMessage}"></div>

            <label for="employeeId">Employee ID</label>
            <input id="employeeId" type="text" name="employeeId" placeholder="EMP-1007" required autofocus/>

            <label for="email">Registered email</label>
            <input id="email" type="email" name="email" placeholder="employee@company.com" required/>

            <button class="btn" type="submit">Send OTP</button>

            <div class="auth-actions">
                <a class="forgot-password-link" th:href="@{/login}">Back to login</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>

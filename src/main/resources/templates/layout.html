<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout (title, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="${title} + ' · VNS Healthcare'">VNS Healthcare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link rel="icon" type="image/png" th:href="@{/images/vns-healthcare-logo.png}"/>
    <link rel="shortcut icon" type="image/png" th:href="@{/images/vns-healthcare-logo.png}"/>
    <link rel="apple-touch-icon" th:href="@{/images/vns-healthcare-logo.png}"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <style>
        /* Flash / notification styles */
        .flash {
            position: fixed;
            left: 50%;
            top: 16px;
            transform: translateX(-50%);
            z-index: 2000;
            padding: 10px 14px;
            border-radius: 10px;
            box-shadow: 0 14px 40px rgba(2,8,6,0.18);
            max-width: 320px;
            width: auto;
            text-align: center;
            font-weight: 600;
            display: inline-block;
            transition: transform 220ms cubic-bezier(.2,.9,.2,1), opacity 180ms ease-in-out;
        }
        .flash.flash-hidden { opacity: 0; transform: translateX(-50%) translateY(-6px); pointer-events: none; }
        .flash.error { background: rgba(255, 141, 107, 0.12); color: var(--coral); border: 1px solid rgba(255, 141, 107, 0.18); }
        .flash:not(.error) { background: rgba(109, 224, 170, 0.10); color: var(--ok); border: 1px solid rgba(109, 224, 170, 0.16); }
        .info-banner { background:#fff8e6; border:1px solid #ffe2a8; padding:10px 14px; border-radius:6px; margin-bottom:12px; }
        .modal-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2500;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(2px);
            animation: fadeIn 0.18s ease;
        }
        .modal-overlay.visible { display: flex; }
        .modal-backdrop {
            position: absolute;
            inset: 0;
            z-index: 0;
            cursor: pointer;
        }
        .modal-content {
            position: relative;
            z-index: 1;
            width: min(92vw, 980px);
            height: min(84vh, 760px);
            background: var(--panel-bg);
            color: var(--ink);
            border-radius: 14px;
            box-shadow: 0 22px 60px rgba(15, 23, 42, 0.28);
            overflow: hidden;
            border: 1px solid var(--line);
        }
        .modal-content.small {
            width: min(92vw, 420px);
            height: auto;
            padding: 18px 18px 12px;
            background: var(--panel-bg);
            color: var(--ink);
        }
        .modal-close {
            position: absolute;
            right: 10px;
            top: 8px;
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 50%;
            background: rgba(15,23,42,0.06);
            color: var(--ink);
            font-size: 26px;
            cursor: pointer;
            z-index: 2;
        }
        .modal-close:hover { background: rgba(15,23,42,0.10); }
        .brochure-modal {
            width: min(92vw, 560px);
            height: auto;
            max-height: min(82vh, 760px);
            overflow: auto;
            padding: 20px 20px 14px;
        }
        .brochure-header {
            margin: 0 0 12px;
            font-size: 1.4rem;
            font-weight: 700;
        }
        .brochure-list {
            display: grid;
            gap: 8px;
            margin: 12px 0 18px;
        }
        .brochure-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(148, 163, 184, 0.04);
        }
        .brochure-option input {
            margin: 0;
        }
        .brochure-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 8px;
        }
        :root[data-theme="dark"] .modal-content,
        :root[data-theme="dark"] .modal-content.small {
            background: #12211f;
            color: #ecf5f1;
            border-color: #23443d;
        }
        :root[data-theme="dark"] .brochure-option {
            background: rgba(255,255,255,0.02);
            border-color: #23443d;
        }
        :root[data-theme="dark"] .modal-close {
            background: rgba(255,255,255,0.08);
            color: #ecf5f1;
        }
        :root[data-theme="dark"] .modal-close:hover { background: rgba(255,255,255,0.14); }
        :root[data-theme="dark"] #confirm-text {
            color: #ecf5f1;
        }
        #file-preview-iframe {
            width: 100%;
            height: 100%;
            display: block;
            border: 0;
            background: var(--panel-bg);
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .data-table-shell {
            overflow-x: auto;
            overflow-y: hidden;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: var(--panel-bg);
            scrollbar-width: thin;
        }
        .data-table-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 14px 0;
            color: var(--muted);
            font-size: 12px;
        }
        .data-table-pagination {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
        }
        .page-btn {
            border: 1px solid var(--line);
            background: transparent;
            color: var(--ink);
            border-radius: 8px;
            min-width: 34px;
            height: 34px;
            padding: 0 10px;
            cursor: pointer;
            font: inherit;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }
        .page-btn:hover:not(:disabled), .page-btn.active {
            background: rgba(27, 92, 84, 0.08);
            border-color: rgba(27, 92, 84, 0.28);
        }
        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .page-btn.active {
            color: var(--teal);
            font-weight: 700;
        }
        @media (max-width: 600px) { .flash { left: 50%; top: 12px; max-width: 92%; transform: translateX(-50%); } .modal-content { height: 72vh; } .data-table-controls { flex-direction: column; align-items: flex-start; } .data-table-pagination { width: 100%; justify-content: flex-start; } }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="brand">
            <div class="mark">V</div>
            <div>
                <h1>VNS Healthcare</h1>
                <p>Home care desk</p>
            </div>
        </div>
        <nav class="nav">
            <a th:if="${canReadDashboard}" th:href="@{/}" th:classappend="${page == 'dashboard'} ? 'active'">Dashboard</a>
            <a th:if="${canReadEmployees}" th:href="@{/employees}" th:classappend="${page == 'employees'} ? 'active'">Employees</a>
            <a th:if="${canReadCustomers}" th:href="@{/customers}" th:classappend="${page == 'customers'} ? 'active'">Leads</a>
            <a th:if="${canReadAttendance}" th:href="@{/attendance}" th:classappend="${page == 'attendance'} ? 'active'">Attendance</a>
            <a th:if="${canReadSalary}" th:href="@{/salary}" th:classappend="${page == 'salary'} ? 'active'">Salary</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}" th:classappend="${page == 'admin'} ? 'active'">Admin</a>
        </nav>
        <div class="sidebar-foot">Staffing · Patient leads · Duty roster</div>
    </aside>
    <div class="content-shell">
        <header class="top-header">
            <div class="profile-menu-wrap">
                <button class="profile-trigger" type="button" aria-expanded="false" data-profile-toggle>
                    <span class="profile-avatar" th:text="${(currentUser != null and !#strings.isEmpty(currentUser)) ? #strings.substring(currentUser, 0, 1).toUpperCase() : 'U'}">U</span>
                    <span class="profile-name" th:if="${currentUser != null}" th:text="${currentUser}">admin</span>
                    <span class="caret">▾</span>
                </button>
                <div class="profile-dropdown" id="profile-dropdown">
                    <div class="profile-menu-header">Account</div>
                    <a class="profile-menu-item" th:href="@{/profile/password}">
                        <span class="menu-icon">🔒</span>
                        <span>Change password</span>
                    </a>
                    <button type="button" class="profile-menu-item" aria-label="Toggle theme" data-theme-toggle>
                        <span class="menu-icon">🌙</span>
                        <span>Dark mode</span>
                    </button>
                    <form th:action="@{/logout}" method="post" class="logout-form-inline">
                        <button type="submit" class="profile-menu-item danger">
                            <span class="menu-icon">↩</span>
                            <span>Logout</span>
                        </button>
                    </form>
                </div>
            </div>
        </header>
        <main class="main">
        <div th:if="${success}" class="flash" th:text="${success}"></div>
        <div th:if="${error}" class="flash error" th:text="${error}"></div>
        <div th:replace="${content}"></div>
        </main>
    </div>
</div>

<!-- File preview modal -->
<div id="file-preview-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-content">
        <button type="button" class="modal-close" data-modal-close aria-label="Close preview">&times;</button>
        <iframe id="file-preview-iframe" src="" title="Document preview"></iframe>
    </div>
</div>

<!-- Brochure options modal -->
<div id="brochure-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-backdrop" data-brochure-close></div>
    <div class="modal-content brochure-modal">
        <button type="button" class="modal-close" data-brochure-close aria-label="Close brochure dialog">&times;</button>

        <div id="brochure-form-panel">
            <h3 class="brochure-header">Prepare brochure</h3>
            <form id="brochure-form" method="get">
                <div class="brochure-list">
                    <label class="brochure-option"><input type="checkbox" name="option" value="interpersonal-relationship" checked/>Interpersonal Relationship: Excellent</label>

                    <div style="margin-top:8px;">
                        <div style="font-weight:700; margin-bottom:8px;">Basic Skill</div>
                        <div class="brochure-list">
                            <label class="brochure-option"><input type="checkbox" name="option" value="sponge-bath" checked/>Sponge Bath</label>
                            <label class="brochure-option"><input type="checkbox" name="option" value="bed-pan-diaper" checked/>Bed Pan / Diaper</label>
                            <label class="brochure-option"><input type="checkbox" name="option" value="mouth-feeding" checked/>Mouth Feeding</label>
                            <label class="brochure-option"><input type="checkbox" name="option" value="ryles-tube-feeding" checked/>Ryle's Tube Feeding</label>
                            <label class="brochure-option"><input type="checkbox" name="option" value="blood-pressure" checked/>Vitals: Blood Pressure</label>
                            <label class="brochure-option"><input type="checkbox" name="option" value="suction-mouth"/>Suction: Mouth</label>
                            <label class="brochure-option"><input type="checkbox" name="option" value="trachea"/>Trachea</label>
                            <label class="brochure-option"><input type="checkbox" name="option" value="tracheostomy-care"/>Tracheostomy Care</label>
                            <label class="brochure-option"><input type="checkbox" name="option" value="blood-sugar-test" checked/>Blood Sugar Test (BSL)</label>
                            <label class="brochure-option"><input type="checkbox" name="option" value="medications-oral" checked/>Medications: Oral</label>
                            <label class="brochure-option"><input type="checkbox" name="option" value="medications-intravenous"/>Medications: Intravenous</label>
                            <label class="brochure-option"><input type="checkbox" name="option" value="medications-intramuscular"/>Medications: Intramuscular</label>
                            <label class="brochure-option"><input type="checkbox" name="option" value="medications-subcutaneous" checked/>Medications: Subcutaneous</label>

                            <div class="brochure-option" style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
                                <label style="display:flex; align-items:center; gap:10px; margin:0;">
                                    <input type="checkbox" name="option" value="catheterisation-care" checked/>Catheterisation &amp; Care
                                </label>
                                <select name="catheterisationCare" aria-label="Catheterisation care level" style="min-width:120px;">
                                    <option value="EXPERT">Expert</option>
                                    <option value="ONLY_CARE" selected>Only Care</option>
                                </select>
                            </div>

                            <div class="brochure-option" style="display:flex; align-items:center; gap:10px;">
                                <label style="display:flex; align-items:center; gap:8px; margin:0;">
                                    <input type="checkbox" id="include-age-checkbox" name="includeAge" value="true" /> Include Age
                                </label>
                                <input type="text" id="brochure-age-field" name="age" placeholder="e.g. 45" style="width:80px; padding:6px 8px; border-radius:6px; border:1px solid var(--line);" disabled />
                            </div>
                        </div>
                    </div>
                </div>
                <div class="brochure-actions">
                    <button type="button" class="btn ghost" data-brochure-close>No</button>
                    <button type="submit" class="btn secondary">Prepare brochure</button>
                </div>
            </form>
        </div>

        <div id="brochure-preview-panel" style="display:none; height: 78vh;">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding: 0 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 12px;">
                <h3 class="brochure-header" style="margin:0;">Brochure preview</h3>
                <button type="button" class="btn ghost small" data-brochure-close>Close</button>
            </div>
            <iframe id="brochure-preview-iframe" title="Brochure preview" style="width:100%; height: calc(100% - 52px); border:0; background:#fff; border-radius:10px;"></iframe>
        </div>
    </div>
</div>

<!-- Delete confirm modal -->
<div id="confirm-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-backdrop" data-confirm-close></div>
    <div class="modal-content small">
        <button type="button" class="modal-close" data-confirm-close aria-label="Close dialog">&times;</button>
        <p id="confirm-text" style="margin: 26px 0 0; text-align:center; font-size:16px;">Are you sure?</p>
        <div style="display:flex; gap:8px; justify-content:center; margin-top:18px;">
            <button type="button" class="btn coral" id="confirm-yes">Yes</button>
            <button type="button" class="btn" id="confirm-no">No</button>
        </div>
    </div>
</div>

<script>
    (function () {
        const root = document.documentElement;
        const toggle = document.querySelector('[data-theme-toggle]');
        const profileToggle = document.querySelector('[data-profile-toggle]');
        const profileDropdown = document.getElementById('profile-dropdown');
        const savedTheme = localStorage.getItem('vns-theme');
        if (savedTheme) {
            root.setAttribute('data-theme', savedTheme);
        }
        function syncTheme() {
            if (!toggle) return;
            const dark = root.getAttribute('data-theme') === 'dark';
            toggle.innerHTML = dark ? '<span>☀️</span><span>Light mode</span>' : '<span>🌙</span><span>Dark mode</span>';
            toggle.setAttribute('aria-pressed', String(dark));
        }
        function closeProfileMenu() {
            if (profileDropdown) {
                profileDropdown.classList.remove('visible');
            }
            if (profileToggle) {
                profileToggle.setAttribute('aria-expanded', 'false');
            }
        }
        syncTheme();
        toggle && toggle.addEventListener('click', function () {
            const nextTheme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', nextTheme);
            localStorage.setItem('vns-theme', nextTheme);
            syncTheme();
            closeProfileMenu();
        });
        profileToggle && profileToggle.addEventListener('click', function (event) {
            event.stopPropagation();
            if (!profileDropdown) return;
            const isVisible = profileDropdown.classList.contains('visible');
            profileDropdown.classList.toggle('visible', !isVisible);
            profileToggle.setAttribute('aria-expanded', String(!isVisible));
        });
        document.addEventListener('click', function (event) {
            const target = event.target;
            if (!target) return;
            if (profileToggle && profileToggle.contains(target)) return;
            if (profileDropdown && !profileDropdown.contains(target)) {
                closeProfileMenu();
            }
        });

    const csrfMeta = document.querySelector('meta[name="_csrf"]');
    const csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
    if (csrfMeta && csrfHeaderMeta) {
        const csrfToken = csrfMeta.getAttribute('content');
        const csrfHeader = csrfHeaderMeta.getAttribute('content');
        document.querySelectorAll('form').forEach(function (form) {
            if (form.querySelector('input[name="_csrf"]')) {
                return;
            }
            const hidden = document.createElement('input');
            hidden.type = 'hidden';
            hidden.name = '_csrf';
            hidden.value = csrfToken;
            form.appendChild(hidden);
        });
        document.addEventListener('submit', function (event) {
            const form = event.target;
            if (form && form.tagName === 'FORM' && !form.querySelector('input[name="_csrf"]')) {
                const hidden = document.createElement('input');
                hidden.type = 'hidden';
                hidden.name = '_csrf';
                hidden.value = csrfToken;
                form.appendChild(hidden);
            }
        }, true);
    }

    // Preserve scroll and show flash messages near the last clicked element.
    try {
        const STORAGE_KEY = 'vns:lastClick';
        function saveClick(event) {
            try {
                const target = event.target || event.srcElement;
                const clickable = target.closest && target.closest('button, input[type=submit], a, select, textarea, form') || target;
                let selector = null;
                if (clickable && clickable.id) {
                    selector = '#' + clickable.id;
                } else if (clickable && clickable.name) {
                    selector = clickable.tagName.toLowerCase() + '[name="' + clickable.name + '"]';
                } else if (clickable && clickable.closest) {
                    const form = clickable.closest('form');
                    if (form && form.id) selector = 'form#' + form.id;
                }
                // determine pointer coordinates (clientX/clientY) if available
                let x = null, y = null;
                try {
                    if (event && typeof event.clientX === 'number' && typeof event.clientY === 'number') {
                        x = event.clientX;
                        y = event.clientY;
                    } else if (event && event.touches && event.touches[0]) {
                        x = event.touches[0].clientX;
                        y = event.touches[0].clientY;
                    } else {
                        // fallback: use focused element center
                        const active = document.activeElement;
                        if (active && active.getBoundingClientRect) {
                            const r = active.getBoundingClientRect();
                            x = Math.round(r.left + r.width / 2);
                            y = Math.round(r.top + r.height / 2);
                        }
                    }
                } catch (e) {
                    // ignore coordinate errors
                }
                const payload = {
                    selector: selector,
                    scrollY: window.scrollY,
                    x: x,
                    y: y,
                    ts: Date.now(),
                    path: window.location.pathname
                };
                sessionStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
            } catch (e) {
                // ignore
            }
        }
        document.addEventListener('click', saveClick, true);
        document.addEventListener('keydown', function (e) {
            // capture enter key on forms
            if (e.key === 'Enter') saveClick(e);
        }, true);

        function restoreFlashAndScroll() {
            try {
                const raw = sessionStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const data = JSON.parse(raw);
                if (!data || !data.ts || !data.path) {
                    sessionStorage.removeItem(STORAGE_KEY);
                    return;
                }
                // allow restore only when the flash is coming from the same page
                if (data.path !== window.location.pathname) {
                    sessionStorage.removeItem(STORAGE_KEY);
                    return;
                }
                // expire after 5 minutes
                if ((Date.now() - data.ts) > (5 * 60 * 1000)) {
                    sessionStorage.removeItem(STORAGE_KEY);
                    return;
                }
                const flash = document.querySelector('.flash') || document.querySelector('.flash.error');
                if (flash) {
                    // restore previous scroll position so page doesn't jump to top
                    if (typeof data.scrollY === 'number') {
                        try { window.scrollTo(0, data.scrollY); } catch (e) { /* ignore */ }
                    }

                    // position flash at top-right corner (no scrolling)
                    flash.style.position = 'fixed';
                    flash.style.zIndex = '2000';
                    flash.style.left = '50%';
                    flash.style.right = 'auto';
                    flash.style.top = '16px';
                    flash.style.transform = 'translateX(-50%)';
                    flash.classList.add('flash-centered');

                    // auto-dismiss after 2s and dismiss on any click
                    (function setupFlashDismiss(node) {
                        if (!node) return;
                        function removeFlash() {
                            try {
                                node.classList.add('flash-hidden');
                                setTimeout(function () { node.parentNode && node.parentNode.removeChild(node); }, 180);
                            } catch (e) {
                                // ignore
                            }
                            document.removeEventListener('click', clickHandler, true);
                            document.removeEventListener('keydown', keyHandler, true);
                        }
                        var clickHandler = function () { removeFlash(); };
                        var keyHandler = function (e) { if (e.key === 'Escape') removeFlash(); };
                        document.addEventListener('click', clickHandler, true);
                        document.addEventListener('keydown', keyHandler, true);
                        // delay 2 seconds (2000ms)
                        setTimeout(removeFlash, 2000);
                    })(flash);
                    // remove stored position data
                    sessionStorage.removeItem(STORAGE_KEY);
                } else if (typeof data.scrollY === 'number') {
                    window.scrollTo(0, data.scrollY);
                    sessionStorage.removeItem(STORAGE_KEY);
                }
            } catch (e) {
                sessionStorage.removeItem(STORAGE_KEY);
            }
        }
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(restoreFlashAndScroll, 40);
        } else {
            document.addEventListener('DOMContentLoaded', function () { setTimeout(restoreFlashAndScroll, 40); });
        }
    } catch (e) {
        // ignore any errors
    }

// preview / confirm modal scripts
        // file preview handler
        function toggleModal(modalId, show) {
            const modal = document.getElementById(modalId);
            if (!modal) return;
            modal.classList.toggle('visible', !!show);
            modal.setAttribute('aria-hidden', String(!show));
            document.body.style.overflow = show ? 'hidden' : '';
            if (!show) {
                const iframe = document.getElementById('file-preview-iframe');
                if (iframe && modalId === 'file-preview-modal') {
                    iframe.src = '';
                }
            }
        }

        function openPreview(url) {
            try {
                const iframe = document.getElementById('file-preview-iframe');
                if (iframe) iframe.src = url;
                toggleModal('file-preview-modal', true);
            } catch (e) { console.error(e); }
        }

        function closePreview() {
            toggleModal('file-preview-modal', false);
        }

        document.querySelectorAll('[data-preview-url]').forEach(function (link) {
            link.addEventListener('click', function (e) {
                e.preventDefault();
                openPreview(link.getAttribute('data-preview-url'));
            });
        });

        document.querySelectorAll('[data-modal-close]').forEach(function (node) {
            node.addEventListener('click', function (e) {
                e.stopPropagation();
                closePreview();
            });
        });

        document.querySelectorAll('[data-brochure-url]').forEach(function (button) {
            button.addEventListener('click', function (e) {
                e.preventDefault();
                const form = document.getElementById('brochure-form');
                if (!form) return;
                // clear previous age field state
                var chk = document.getElementById('include-age-checkbox');
                var fld = document.getElementById('brochure-age-field');
                if (chk) { chk.checked = false; }
                if (fld) { fld.value = ''; fld.disabled = true; }
                form.setAttribute('action', button.getAttribute('data-brochure-url'));
                toggleModal('brochure-modal', true);
            });
        });

        // toggle age field enable/disable
        var includeAgeChk = document.getElementById('include-age-checkbox');
        var includeAgeFld = document.getElementById('brochure-age-field');
        function syncBrochureAgeToggle() {
            if (!includeAgeChk || !includeAgeFld) return;
            includeAgeFld.disabled = !includeAgeChk.checked;
            if (!includeAgeChk.checked) includeAgeFld.value = '';
        }
        if (includeAgeChk) includeAgeChk.addEventListener('change', syncBrochureAgeToggle);


        document.querySelectorAll('[data-brochure-close]').forEach(function (node) {
            node.addEventListener('click', function (e) {
                e.stopPropagation();
                toggleModal('brochure-modal', false);
            });
        });

        function addTablePagination() {
            document.querySelectorAll('table').forEach(function (table) {
                if (table.dataset.paginationBound === 'true' || table.closest('.data-table-shell') || table.classList.contains('attendance-table')) {
                    return;
                }
                if (!table.tBodies || !table.tBodies[0] || !table.tBodies[0].rows.length) {
                    return;
                }

                const rows = Array.from(table.tBodies[0].rows);
                const pageSize = 10;
                let currentPage = 1;
                const shell = document.createElement('div');
                shell.className = 'data-table-shell';
                table.parentNode.insertBefore(shell, table);
                shell.appendChild(table);

                const controls = document.createElement('div');
                controls.className = 'data-table-controls';
                const summary = document.createElement('div');
                const pagination = document.createElement('div');
                pagination.className = 'data-table-pagination';
                controls.appendChild(summary);
                controls.appendChild(pagination);
                shell.appendChild(controls);

                function renderPage() {
                    const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
                    currentPage = Math.min(currentPage, totalPages);
                    rows.forEach(function (row, index) {
                        row.style.display = (index >= (currentPage - 1) * pageSize && index < currentPage * pageSize) ? '' : 'none';
                    });

                    const start = rows.length === 0 ? 0 : (currentPage - 1) * pageSize + 1;
                    const end = Math.min(currentPage * pageSize, rows.length);
                    summary.textContent = 'Showing ' + start + '-' + end + ' of ' + rows.length;

                    pagination.innerHTML = '';
                    const prev = document.createElement('button');
                    prev.type = 'button';
                    prev.className = 'page-btn';
                    prev.textContent = 'Prev';
                    prev.disabled = currentPage === 1;
                    prev.addEventListener('click', function () { if (currentPage > 1) { currentPage--; renderPage(); } });
                    pagination.appendChild(prev);

                    for (let page = 1; page <= totalPages; page++) {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'page-btn' + (page === currentPage ? ' active' : '');
                        btn.textContent = String(page);
                        btn.disabled = totalPages <= 1;
                        btn.addEventListener('click', function () { currentPage = page; renderPage(); });
                        pagination.appendChild(btn);
                    }

                    const next = document.createElement('button');
                    next.type = 'button';
                    next.className = 'page-btn';
                    next.textContent = 'Next';
                    next.disabled = currentPage === totalPages;
                    next.addEventListener('click', function () { if (currentPage < totalPages) { currentPage++; renderPage(); } });
                    pagination.appendChild(next);
                }

                renderPage();
                table.dataset.paginationBound = 'true';
            });
        }

        addTablePagination();

        const brochureForm = document.getElementById('brochure-form');
        const brochureFormPanel = document.getElementById('brochure-form-panel');
        const brochurePreviewPanel = document.getElementById('brochure-preview-panel');
        const brochurePreviewFrame = document.getElementById('brochure-preview-iframe');

        function showBrochurePreview(url) {
            if (brochurePreviewFrame) {
                brochurePreviewFrame.src = url;
            }
            if (brochureFormPanel) brochureFormPanel.style.display = 'none';
            if (brochurePreviewPanel) brochurePreviewPanel.style.display = 'block';
        }

        if (brochureForm) {
            brochureForm.addEventListener('submit', function (e) {
                e.preventDefault();
                const action = brochureForm.getAttribute('action') || window.location.href;
                const params = new URLSearchParams(new FormData(brochureForm));
                const url = new URL(action, window.location.origin);
                const existing = new URLSearchParams(url.search);
                params.forEach(function (value, key) {
                    existing.append(key, value);
                });
                url.search = existing.toString();
                showBrochurePreview(url.toString());
            });
        }

        document.querySelectorAll('[data-brochure-close]').forEach(function (node) {
            node.addEventListener('click', function (e) {
                e.stopPropagation();
                if (brochurePreviewPanel && brochurePreviewPanel.style.display === 'block') {
                    brochurePreviewPanel.style.display = 'none';
                    if (brochureFormPanel) brochureFormPanel.style.display = 'block';
                    if (brochurePreviewFrame) brochurePreviewFrame.src = '';
                }
                toggleModal('brochure-modal', false);
            });
        });

        var confirmResolve = null;
        function showConfirm(text) {
            return new Promise(function (resolve) {
                try {
                    const modal = document.getElementById('confirm-modal');
                    const textNode = document.getElementById('confirm-text');
                    if (textNode) textNode.textContent = text || 'Are you sure?';
                    toggleModal('confirm-modal', true);
                    confirmResolve = function (ok) {
                        toggleModal('confirm-modal', false);
                        resolve(ok);
                    };
                } catch (e) { resolve(false); }
            });
        }

        document.getElementById('confirm-yes') && document.getElementById('confirm-yes').addEventListener('click', function () {
            if (confirmResolve) confirmResolve(true);
        });
        document.getElementById('confirm-no') && document.getElementById('confirm-no').addEventListener('click', function () {
            if (confirmResolve) confirmResolve(false);
        });
        document.querySelectorAll('[data-confirm-close]').forEach(function (node) {
            node.addEventListener('click', function (e) {
                e.stopPropagation();
                if (confirmResolve) confirmResolve(false);
            });
        });
        document.querySelectorAll('[data-confirm-delete]').forEach(function (btn) {
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                var form = btn.closest('form');
                showConfirm(btn.getAttribute('data-confirm-text') || 'Delete this document?').then(function (ok) {
                    if (ok && form) form.submit();
                });
            });
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                const previewVisible = document.getElementById('file-preview-modal') && document.getElementById('file-preview-modal').classList.contains('visible');
                const brochureVisible = document.getElementById('brochure-modal') && document.getElementById('brochure-modal').classList.contains('visible');
                const confirmVisible = document.getElementById('confirm-modal') && document.getElementById('confirm-modal').classList.contains('visible');
                if (previewVisible) closePreview();
                if (brochureVisible) toggleModal('brochure-modal', false);
                if (confirmVisible && confirmResolve) confirmResolve(false);
            }
        }, true);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(${mode == 'create'} ? 'New employee' : 'Edit employee', ~{::section})">
<section>
    <div class="topbar">
        <div>
            <p class="eyebrow">Staff</p>
            <h2 class="page-title" th:text="${mode == 'create'} ? 'Add employee' : 'Edit employee'">Add employee</h2>
            <p class="sub" th:if="${mode == 'edit'}" th:text="${empCode}">EMP-1001</p>
        </div>
        <a class="btn ghost" th:href="@{/employees}">Back to list</a>
    </div>

    <div class="panel">
        <form th:action="${mode == 'create'} ? @{/employees} : @{/employees/{id}(id=${employeeId})}"
              th:object="${form}" method="post" enctype="multipart/form-data">
            <input th:if="${_csrf != null}" type="hidden" name="_csrf" th:value="${_csrf.token}"/>
            <div class="form-grid">
                <div class="field">
                    <label class="req">Full name</label>
                    <input type="text" th:field="*{fullName}"/>
                    <div class="error-text" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>
                <div class="field">
                    <label class="req">Mobile no.</label>
                    <input type="text" th:field="*{mobileNo}" maxlength="10"/>
                    <div class="error-text" th:if="${#fields.hasErrors('mobileNo')}" th:errors="*{mobileNo}"></div>
                </div>
                <div class="field">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" placeholder="name@example.com"/>
                    <div class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="field">
                    <label class="req">Joining date</label>
                    <input type="date" th:field="*{joiningDate}"/>
                    <div class="error-text" th:if="${#fields.hasErrors('joiningDate')}" th:errors="*{joiningDate}"></div>
                </div>
                <div class="field">
                    <label class="req">Gender</label>
                    <select th:field="*{gender}">
                        <option value="">Select</option>
                        <option value="MALE">Male</option>
                        <option value="FEMALE">Female</option>
                    </select>
                    <div class="error-text" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
                </div>
                <div class="field">
                    <label class="req">Marital status</label>
                    <select th:field="*{maritalStatus}">
                        <option value="">Select</option>
                        <option value="SINGLE">Single</option>
                        <option value="MARRIED">Married</option>
                        <option value="DIVORCED">Divorced</option>
                    </select>
                </div>
                <div class="field">
                    <label class="req">Designation</label>
                    <select th:field="*{designation}">
                        <option value="">Select</option>
                        <option value="CARE_GIVER">Care Giver</option>
                        <option value="NURSE">Nurse</option>
                        <option value="DOCTOR">Doctor</option>
                        <option value="PHYSIOTHERAPY">Physiotherapy</option>
                        <option value="HR">HR</option>
                        <option value="FIELD_OFFICER">Field Officer</option>
                        <option value="COORDINATOR">Coordinator</option>
                        <option value="ACCOUNTANT">Accountant</option>
                        <option value="DIRECTOR">Director</option>
                    </select>
                    <div class="error-text" th:if="${#fields.hasErrors('designation')}" th:errors="*{designation}"></div>
                </div>
                <div class="field">
                    <label class="req">Date of birth</label>
                    <input type="date" th:field="*{dateOfBirth}"/>
                    <div class="error-text" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div>
                </div>
                <div class="field">
                    <label>Referred by</label>
                    <input type="text" th:field="*{referredBy}"/>
                </div>
                <div class="field">
                    <label class="req">Aadhar number</label>
                    <input type="text" th:field="*{aadharNumber}" maxlength="12"/>
                    <div class="error-text" th:if="${#fields.hasErrors('aadharNumber')}" th:errors="*{aadharNumber}"></div>
                </div>
                <div class="field">
                    <label class="req">No. of experience</label>
                    <input type="number" th:field="*{noOfExperience}" min="0" step="0.1" placeholder="e.g. 2.5"/>
                    <div class="error-text" th:if="${#fields.hasErrors('noOfExperience')}" th:errors="*{noOfExperience}"></div>
                </div>
                <div class="field">
                    <label class="req">Salary</label>
                    <input type="text" th:field="*{salary}" inputmode="decimal" placeholder="e.g. 18000"/>
                    <div class="error-text" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
                </div>
                <div class="field full">
                    <label class="req">Full address</label>
                    <textarea rows="3" th:field="*{fullAddress}"></textarea>
                    <div class="error-text" th:if="${#fields.hasErrors('fullAddress')}" th:errors="*{fullAddress}"></div>
                </div>
                <!--<div class="field full" th:if="${mode == 'create'}">
                    <label>Upload document</label>
                    <input type="file" name="document"/>
                </div>-->
            </div>
            <div class="actions" style="margin-top:20px">
                <button class="btn" type="submit" th:text="${mode == 'create'} ? 'Save employee' : 'Save changes'">Save</button>
            </div>
        </form>
    </div>
</section>
</html>

<div class="panel" id="salary">
<div class="topbar" style="margin-bottom:12px">
       <h3 style="margin:0">Salary paid status</h3>
       <form method="get" th:action="@{/employees/{id}(id=${employee.id})}" class="search" style="margin:0">
           <input type="number" name="year" th:value="${salaryYear}" min="2020" max="2100" style="max-width:100px"/>
           <button class="btn ghost" type="submit">Year</button>
       </form>
</div>
<p class="sub">June / July / August can be Paid while the current month stays In progress until you mark it Paid.</p>
<table>
       <thead>
       <tr>
           <th>Month</th>
           <th>Status</th>
           <th>Paid on</th>
           <th></th>
       </tr>
       </thead>
       <tbody>
       <tr th:each="m : ${salaryMonths}">
           <td>
               <span th:text="${m.label}">June</span>
               <span class="badge muted" th:if="${m.currentMonth}">This month</span>
           </td>
           <td>
               <span class="badge muted" th:if="${m.status == null}">—</span>
               <span class="badge ok" th:if="${m.paid}">Paid</span>
               <span class="badge warn" th:if="${m.inProgress}">In progress</span>
               <span class="badge coral" th:if="${m.unpaid}">Unpaid</span>
           </td>
           <td th:text="${m.payment != null and m.payment.paidOn != null} ? ${#temporals.format(m.payment.paidOn, 'dd MMM yyyy')} : '—'">—</td>
           <td>
               <form th:if="${canWriteEmployees and m.status != null}" th:action="@{/employees/{id}/salary(id=${employee.id})}" method="post" class="search salary-status-form" style="margin:0; display:flex; flex-direction:column; gap:6px; align-items:flex-start; width:170px" data-salary-status-form>
                   <input type="hidden" name="year" th:value="${salaryYear}"/>
                   <input type="hidden" name="month" th:value="${m.monthValue}"/>
                   <input type="hidden" name="anchor" value="salary-tab"/>
                   <input th:if="${_csrf != null}" type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                   <select name="status" style="max-width:130px" th:disabled="${m.paid}">
                       <option value="PAID" th:selected="${m.paid}">Paid</option>
                       <option value="IN_PROGRESS" th:selected="${m.inProgress}">In progress</option>
                       <option value="UNPAID" th:selected="${m.unpaid}">Unpaid</option>
                   </select>
                   <div style="display:flex; flex-direction:column; align-items:flex-start; gap:4px;">
                       <input type="date" name="paidOn" style="max-width:130px; width:100%" th:disabled="${m.paid}" th:value="${m.payment != null and m.payment.paidOn != null} ? ${#temporals.format(m.payment.paidOn, 'yyyy-MM-dd')} : ''" data-paid-on-input required="required"/>
                   </div>
                   <textarea name="notes" rows="2" placeholder="Salary comment" style="resize:vertical; width:100%" th:disabled="${m.paid}" th:text="${m.payment != null} ? ${m.payment.notes} : ''"></textarea>
                   <button class="btn secondary" type="submit" th:disabled="${m.paid}">Save</button>
               </form>
           </td>
       </tr>
       </tbody>
</table>
<script>
       document.addEventListener('DOMContentLoaded', function () {
           function bindForm(form) {
               if (!form || form.dataset.bound === 'true') return;
               form.dataset.bound = 'true';
               var select = form.querySelector('select[name="status"]');
               var paidOnInput = form.querySelector('input[name="paidOn"]');
               var submitBtn = form.querySelector('button[type="submit"]');
               if (!select || !paidOnInput) return;

               var hiddenStatus = form.querySelector('input[data-status-hidden]');
               if (!hiddenStatus) {
                   hiddenStatus = document.createElement('input');
                   hiddenStatus.type = 'hidden';
                   hiddenStatus.name = 'status';
                   hiddenStatus.dataset.statusHidden = 'true';
                   form.appendChild(hiddenStatus);
               }
               var originalSelectName = select.name || 'status';
               if (originalSelectName === 'status') {
                   select.name = 'statusSelect';
               }
               hiddenStatus.value = select.value;

               function update() {
                   hiddenStatus.value = select.value;
                   if (submitBtn) submitBtn.disabled = false;
                   if (paidOnInput) {
                       var isPaid = ('' + select.value).toUpperCase() === 'PAID';
                       paidOnInput.required = isPaid;
                       if (isPaid && !paidOnInput.value) {
                           paidOnInput.setCustomValidity('Please select the Paid on date before saving.');
                       } else {
                           paidOnInput.setCustomValidity('');
                       }
                   }
               }

               select.addEventListener('change', update);
               paidOnInput.addEventListener('input', update);
               paidOnInput.addEventListener('change', update);

               form.addEventListener('submit', function (event) {
                   hiddenStatus.value = select.value;
                   var isPaid = ('' + select.value).toUpperCase() === 'PAID';
                   paidOnInput.required = isPaid;
                   if (isPaid && (!paidOnInput || !paidOnInput.value)) {
                       event.preventDefault();
                       if (paidOnInput) {
                           paidOnInput.focus();
                           paidOnInput.setCustomValidity('Please select the Paid on date before saving.');
                           paidOnInput.reportValidity();
                       }
                       return false;
                   }
                   paidOnInput.setCustomValidity('');
                   var formData = new FormData(form);
                   formData.delete('status');
                   formData.set('status', select.value);
                   if (submitBtn) submitBtn.disabled = true;
                   fetch(form.action, {
                       method: 'POST',
                       body: formData,
                       headers: { 'X-Requested-With': 'XMLHttpRequest' }
                   }).then(function (response) {
                       if (!response.ok) {
                           throw new Error('Salary update failed');
                       }
                       return response.text();
                   }).then(function (html) {
                       var parser = new DOMParser();
                       var doc = parser.parseFromString(html, 'text/html');
                       var fragment = doc.getElementById('salary');
                       var root = document.getElementById('salary-fragment-root');
                       if (fragment && root) {
                           root.innerHTML = fragment.outerHTML;
                           document.querySelectorAll('.salary-status-form').forEach(function (nextForm) {
                               if (nextForm.dataset.bound === 'true') {
                                   nextForm.dataset.bound = 'false';
                               }
                           });
                           bindSalaryStatusForms();
                       }
                   }).catch(function () {
                       form.submit();
                   }).finally(function () {
                       if (submitBtn) submitBtn.disabled = false;
                   });
                   event.preventDefault();
                   return false;
               });

               update();
           }

           document.querySelectorAll('form[data-salary-status-form]').forEach(bindForm);
       });
</script>
</div>
